<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
  :root{--bg:#11131a;--card:#1b1f2a;--line:#2d3342;--ink:#e9ecf2;--dim:#9aa3b5;--acc:#6ea8fe}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px}
  h1{font-size:26px;margin:0 0 6px;text-align:center}
  p.sub{color:var(--dim);text-align:center;margin:0 0 28px}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
        max-width:1040px;margin:0 auto}
  a.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
         text-decoration:none;color:inherit;display:block;text-align:center;
         transition:transform .15s ease,border-color .15s ease}
  a.card:hover{transform:translateY(-3px);border-color:var(--acc)}
  a.card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0e1016}
  a.card .t{padding:12px 12px 2px;font-weight:600}
  a.card .p{padding:0 12px 14px;color:var(--acc);font-size:13px}
  .empty{color:var(--dim);text-align:center}
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="sub">Click a game to play.</p>
  <div class="grid" id="grid"></div>

<script>
fetch('games.json')
  .then(r => r.json())
  .then(games => {
    const grid = document.getElementById('grid');
    if (!games.length) { grid.innerHTML = '<p class="empty">No games yet.</p>'; return; }
    games.forEach(g => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = g.url;
      const img = document.createElement('img');
      img.src = g.img; img.alt = g.name;
      const t = document.createElement('div');
      t.className = 't'; t.textContent = g.name;
      const p = document.createElement('div');
      p.className = 'p'; p.textContent = 'Click to play →';
      a.append(img, t, p);
      grid.appendChild(a);
    });
  })
  .catch(() => {
    document.getElementById('grid').innerHTML =
      '<p class="empty">Could not load games.json — check the file is next to index.html.</p>';
  });
</script>
</body>
</html>
