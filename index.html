<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Games</title>
<style>
  :root{--bg:#11131a;--card:#1b1f2a;--line:#2d3342;--ink:#e9ecf2;--dim:#9aa3b5;--acc:#6ea8fe}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:28px}
  h1{font-size:26px;margin:0 0 6px;text-align:center}
  p.sub{color:var(--dim);text-align:center;margin:0 0 28px}
  .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
        max-width:1040px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
         cursor:pointer;display:block;text-align:center;
         transition:transform .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-3px);border-color:var(--acc)}
  .card img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:#0e1016}
  .card .t{padding:12px 12px 2px;font-weight:600}
  .card .p{padding:0 12px 14px;color:var(--acc);font-size:13px}
  .empty{color:var(--dim);text-align:center}
  #play{display:none;max-width:1040px;margin:0 auto}
  #back{background:var(--acc);color:#09101e;border:0;border-radius:8px;padding:10px 16px;
        font:600 14px/1 inherit;cursor:pointer;margin-bottom:14px}
  #title{display:inline-block;margin-left:12px;color:var(--dim);font-size:14px}
  #frame{width:100%;height:640px;border:1px solid var(--line);border-radius:10px;background:#0e1016}
</style>
</head>
<body>
  <h1>Games</h1>
  <p class="sub" id="sub">Click a game to play.</p>

  <div class="grid" id="grid"></div>

  <div id="play">
    <button id="back">&larr; Back to games</button>
    <span id="title"></span>
    <iframe id="frame" title="Game"></iframe>
  </div>

<script>
const grid  = document.getElementById('grid');
const play  = document.getElementById('play');
const frame = document.getElementById('frame');
const sub   = document.getElementById('sub');
const title = document.getElementById('title');

function openGame(game){
  frame.src = game.url;
  title.textContent = game.name;
  grid.style.display = 'none';
  sub.style.display  = 'none';
  play.style.display = 'block';
  window.scrollTo(0,0);
}

function closeGame(){
  frame.src = '';
  play.style.display = 'none';
  grid.style.display = 'grid';
  sub.style.display  = 'block';
}

document.getElementById('back').onclick = closeGame;

fetch('games.json')
  .then(r => r.json())
  .then(games => {
    if (!games.length) { grid.innerHTML = '<p class="empty">No games yet.</p>'; return; }
    games.forEach(game => {
      const c = document.createElement('div');
      c.className = 'card';
      const img = document.createElement('img');
      img.src = game.img; img.alt = game.name;
      const t = document.createElement('div');
      t.className = 't'; t.textContent = game.name;
      const p = document.createElement('div');
      p.className = 'p'; p.textContent = 'Click to play →';
      c.append(img, t, p);
      c.onclick = () => openGame(game);
      grid.appendChild(c);
    });
  })
  .catch(() => {
    grid.innerHTML =
      '<p class="empty">Could not load games.json — check the file is next to index.html.</p>';
  });
</script>
</body>
</html>
